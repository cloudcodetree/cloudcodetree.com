name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege by default; the deploy job elevates to contents:write itself.
permissions:
  contents: read

# Rapid feed pushes can queue overlapping runs; two racing Worker deploys could
# land out of order. Serialize per ref and drop superseded in-flight runs
# (only the newest commit's deploy matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Image decoding runs on a separate runner with no deployment credentials.
  prepare-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - name: Download and decode images without deployment credentials
      env:
        # Optional read-only photo search key; no Cloudflare or repository-write token.
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: node scripts/ingest-feed.mjs --prepare-images=.prepared-images
    - uses: actions/upload-artifact@v4
      with:
        name: prepared-images
        path: .prepared-images/
        include-hidden-files: true
        retention-days: 1

  rehost-images:
    needs: prepare-images
    outputs:
      commit: ${{ steps.published.outputs.commit }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.0.9

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - uses: actions/download-artifact@v8
      with:
        name: prepared-images
        path: .prepared-images
    - name: Upload prepared JPEGs (no image decoder runs in this job)
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: node scripts/upload-prepared-images.mjs .prepared-images

    # Zero-result searches, out of Workers observability (which keeps them for
    # about a week) and into the committed content/search-misses.jsonl, so the
    # publishing routine can see what readers could not find. The script exits 0
    # on every failure path, and continue-on-error makes that structural rather
    # than conventional: a failure of THIS job skips `build` entirely
    # (build's `if` drops out when rehost-images fails), so telemetry must never
    # be able to take the deploy down with it.
    - name: Harvest zero-result searches
      continue-on-error: true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: node scripts/harvest-search-misses.mjs

    - name: Validate blog index
      run: node scripts/validate-blog.mjs

    - name: Commit re-hosted image URLs + harvested searches (if any)
      # The two search-misses files are committed (empty / zeroed to begin with)
      # precisely so this guard can see them: `git diff` is blind to untracked
      # files, and a first harvest into an untracked file would never be
      # committed. The .state.json is the harvest cursor — without it every run
      # would re-count the same events.
      run: |
        paths="public/blog/posts.json content/search-misses.jsonl content/search-misses.state.json"
        if git diff --quiet -- $paths; then
          echo "nothing to commit"
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $paths
          git commit -m "blog: re-host images + harvest search misses (CI)"
          git push origin HEAD:main
        fi

    - name: Record the exact commit to build
      id: published
      run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Cutover leftovers on a timer (runbook step 8). The gh-pages branch and
    # the blog-images Release are cold fallbacks that must not be deleted
    # until the new paths have soaked. Both actions are idempotent; once both
    # are gone this step is a no-op and can be removed.
    - name: Retire cold fallbacks once their soak has passed
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        today=$(date -u +%F)
        if [ "$today" \> "2026-09-18" ] && git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
          echo "soak over: deleting the gh-pages branch"
          git push origin --delete gh-pages
        fi
        if [ "$today" \> "2026-09-25" ] && gh release view blog-images >/dev/null 2>&1; then
          echo "soak over: deleting the blog-images Release"
          gh release delete blog-images --yes --cleanup-tag
        fi

  build:
    needs: rehost-images
    # Run for PRs (rehost-images is skipped there) and after it on main pushes.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.rehost-images.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # Build precisely the checked/updated commit from this run.
        ref: ${{ needs.rehost-images.outputs.commit || github.sha }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.0.9

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Dependency security audit + lint
      run: pnpm audit --audit-level=high && pnpm run lint

    # The suite guards the Worker handlers, the chunker, the feed merger and
    # the rank fusion — none of which validate-blog can see. It ran only on a
    # developer's machine until 2026-09-08, so a broken handler could deploy.
    - name: Unit tests + worker typecheck
      run: |
        pnpm test
        pnpm run typecheck:worker

    - name: Validate blog index
      run: node scripts/validate-blog.mjs

    - name: Validate research log ↔ feed consistency
      run: node scripts/validate-research-log.mjs

    # Search index: embed changed posts (Workers AI) into Vectorize and write
    # public/blog/related.json for the build. Diff-based, so an unchanged
    # corpus makes zero model calls. Never fails the deploy — content always
    # ships; the next push catches the index up.
    - name: Index posts for search
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: node scripts/index-search.mjs || echo "::warning title=search index::index-search failed; search runs keyword-only until the next push"

    - name: Dry-run the search indexer (PR builds)
      if: github.event_name != 'push'
      run: node scripts/index-search.mjs --dry-run

    # The earlier validate runs before related.json exists, so checkRelated()
    # is a no-op there. This one is the only pass that sees the real file — a
    # neighbor pointing at a removed post fails the build here, not in prod.
    - name: Validate blog index (with related.json)
      run: node scripts/validate-blog.mjs

    - name: Build
      run: pnpm run build

    - name: Install browser for smoke checks
      run: pnpm exec playwright install --with-deps chromium

    - name: Browser smoke checks against the production export
      run: pnpm run test:browser

    # The production deploy, in the same job as the build (no artifact hop, no
    # second install): cct-site on Cloudflare Workers, serving cloudcodetree.com
    # via the route in wrangler.jsonc. Gated on the repo variable
    # ENABLE_WORKER_DEPLOY=true plus the CLOUDFLARE_API_TOKEN /
    # CLOUDFLARE_ACCOUNT_ID secrets (scripts/set-ci-secrets.mjs sets all three).
    # PR builds stop after the browser checks.
    - name: Vendor gated demo builds
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_WORKER_DEPLOY == 'true'
      run: node scripts/fetch-demo-artifacts.mjs

    - name: Refuse a beta preview build on the production deploy path
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_WORKER_DEPLOY == 'true'
      run: node scripts/assert-variant.mjs production

    - name: Deploy production Worker
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_WORKER_DEPLOY == 'true'
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: deploy

    # A fresh Worker version cold-starts the AI binding: the first /api/search
    # takes 4-8s, past the browser's 2s budget, so search silently degrades to
    # keyword-only for the first visitors. One throwaway query absorbs that.
    # Never fails the deploy — the site is already live at this point.
    - name: Warm the search endpoint
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_WORKER_DEPLOY == 'true'
      run: |
        for i in 1 2 3; do
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://cloudcodetree.com/api/search?q=warmup+$(date +%s)-$i" || true)
          echo "warm-up $i: HTTP $code"
          [ "$code" = "200" ] && exit 0
          sleep 5
        done
        echo "::warning title=search warm-up::endpoint did not return 200; first live search may be keyword-only"

    - name: Verify deployed production behavior
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_WORKER_DEPLOY == 'true'
      run: |
        node scripts/check-parity.mjs --origin https://cloudcodetree.com
        PLAYWRIGHT_BASE_URL=https://cloudcodetree.com pnpm run test:browser
