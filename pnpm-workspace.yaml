# Packages whose install/build scripts are allowed to run.
# pnpm blocks dependency build scripts by default as a supply-chain defense;
# each of these needs its postinstall to be functional at all:
#   sharp         - image compression in scripts/ingest-feed.mjs
#   unrs-resolver - native resolver used by eslint
#   esbuild       - vitest's bundler
#   workerd       - the Cloudflare Workers runtime behind `wrangler dev`
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

# Upstream tools still pin vulnerable transitive versions; remove these once
# Next.js, Miniflare, ESLint, Tailwind and Vitest adopt the patched releases
# themselves.
overrides:
  'next>postcss': 8.5.28
  'miniflare>sharp': 0.35.5
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'source-map-js@<1.2.2': 1.2.2
  'vite@>=8.0.0 <8.2.4': 8.3.5
  # GHSA-xjj6-f33q-929c: DoS on excessive content-encodings, fixed in 7.30.1.
  # Reached via wrangler>miniflare (local dev + browser tests only).
  'miniflare>undici': 7.30.1

# Advisories with no patched release, accepted with a reason. Remove each entry
# once a fixed version ships and an override above can replace it.
#   GHSA-vfj7-8cjw-p6xm  braces <=3.0.3, no 3.0.4 on npm (checked 2026-10-21).
#     Stack-exhaustion DoS from deeply nested glob patterns. Reached only
#     through Tailwind's build-time file scanning, on globs from our own
#     tailwind.config. No external input reaches it.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
